version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: signalnine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker1:
    build:
      context: .
      dockerfile: src/SignalNine.Worker/Dockerfile
    environment:
      SIGNAL9_REDIS_URL: redis://redis:6379
      SIGNAL9_WORKER_NAME: worker1
      SIGNAL9_MAX_CONCURRENT_JOBS: 2
    volumes:
      - /signal9_work:/signal9_work
    depends_on: [redis]
    restart: unless-stopped

  worker2:
    build:
      context: .
      dockerfile: src/SignalNine.Worker/Dockerfile
    environment:
      SIGNAL9_REDIS_URL: redis://redis:6379
      SIGNAL9_WORKER_NAME: worker2
      SIGNAL9_MAX_CONCURRENT_JOBS: 2
    volumes:
      - /signal9_work:/signal9_work
    depends_on: [redis]
    restart: unless-stopped

volumes:
  redis_data:
